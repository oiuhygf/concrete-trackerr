<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--paper:#f4f6f8;--card:#fff;--card2:#f8fafc;--ink:#111827;--soft:#374151;--mute:#6b7280;--line:#e5e7eb;--teal:#0d9488;--teal-d:#0f766e;--teal2:#0891b2;--tint:#d9f2ee;--red:#dc2626;--header-bg:rgba(255,255,255,.85);--hover:#eef1f5;--track:#e9ecf1;--fl:#b8ece3;--big-line:#bfe6dd;--shadow:0 1px 2px rgba(16,24,40,.05),0 12px 30px rgba(16,24,40,.08);--shadow-sm:0 1px 2px rgba(16,24,40,.06)}
:root[data-dark="1"]{--paper:#0f1115;--card:#171a21;--card2:#1d2129;--ink:#eef1f6;--soft:#c7ccd4;--mute:#8b94a3;--line:#2a2f3a;--teal:#2dd4bf;--teal-d:#6ee7d7;--teal2:#22d3ee;--tint:#122624;--red:#f87171;--header-bg:rgba(15,17,21,.85);--hover:#232833;--track:#272d38;--fl:#0e3a32;--big-line:#1d3b35;--shadow:0 1px 2px rgba(0,0,0,.45),0 14px 34px rgba(0,0,0,.45);--shadow-sm:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}
:root{scrollbar-color:var(--line) var(--paper);scrollbar-width:thin}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);background-image:radial-gradient(1100px 520px at 85% -12%,var(--tint),transparent 62%);background-repeat:no-repeat;color:var(--ink);font:400 17px/1.6 "Geist","Noto Sans Arabic",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh;transition:background-color .35s ease,color .35s ease}
::selection{background:var(--tint);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--paper)}
::-webkit-scrollbar-track{background:var(--paper)}
header{background:var(--header-bg);backdrop-filter:blur(16px) saturate(1.5);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);transition:background-color .35s ease,border-color .35s ease}
header h1{font-size:19px;font-weight:700;margin:0;flex:1;display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--teal),var(--teal2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--teal)}
.lg{height:36px;width:auto;display:block}
.plogo{height:80px;width:auto;display:block;margin:0 auto 8px}
.tab{background:transparent;color:var(--soft);border:1px solid transparent;border-radius:999px;padding:6px 16px;font:inherit;font-weight:500;cursor:pointer;transition:background-color .2s ease,color .2s ease,transform .15s ease,box-shadow .2s ease,border-color .2s ease}
.tab:hover{background:var(--hover);transform:translateY(-1px)}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:var(--shadow-sm)}
#net{font-size:13px;padding:2px 12px 2px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--teal-d);transition:background-color .3s,color .3s,border-color .3s}
#net::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-inline-end:6px;animation:dotPulse 2.2s ease-in-out infinite}
#net.off{color:var(--red)}#net.off::before{background:var(--red)}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 var(--tint)}50%{box-shadow:0 0 0 6px transparent}}
main{padding:20px 16px 48px;max-width:1100px;margin:auto}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.grid{display:grid;gap:10px}
.sites{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.qtys{grid-template-columns:repeat(4,1fr)}
button.b{font:inherit;font-size:20px;font-weight:600;padding:16px 8px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .14s ease,background-color .25s ease,border-color .25s ease,color .25s ease,box-shadow .25s ease}
button.b:hover{border-color:var(--teal);color:var(--teal-d);transform:translateY(-2px);box-shadow:var(--shadow)}
button.b:active{transform:scale(.98)}
button.b.sel{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(13,148,136,.35)}
input,select{font:inherit;font-size:20px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;width:100%;background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm);transition:border-color .2s ease,box-shadow .2s ease,background-color .35s,color .35s}
input:focus,select:focus{border-color:var(--teal);outline:3px solid var(--tint);outline-offset:0}
h2{margin:26px 0 10px;font-size:14px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal2));box-shadow:0 0 10px var(--tint);animation:dotPulse 2.6s ease-in-out infinite}
#send{display:block;width:100%;font:inherit;font-size:21px;font-weight:600;padding:18px 12px;background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;border:0;border-radius:999px;margin:18px 0;cursor:pointer;position:sticky;bottom:12px;box-shadow:0 0 0 6px var(--paper),0 10px 26px rgba(13,148,136,.4);transition:transform .14s ease,box-shadow .25s ease,filter .2s ease}
#send:hover{transform:translateY(-2px);filter:brightness(1.06)}
#send:active{transform:scale(.98)}
#send:disabled{background:#8a8a8e;box-shadow:0 0 0 6px var(--paper)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;box-shadow:var(--shadow-sm);transition:background-color .2s ease,border-color .2s ease,transform .15s ease}
.row:hover{border-color:var(--teal);transform:translateY(-2px)}
.big{background:linear-gradient(165deg,var(--tint),var(--card));border:1px solid var(--big-line);border-radius:28px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow);transition:background-color .35s ease,border-color .35s ease}
.big .n{font-size:clamp(60px,15vw,112px);font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;display:inline-block;border-radius:16px;padding:0 4px;color:var(--teal);background:linear-gradient(135deg,var(--teal),var(--teal2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:fadeUp .5s ease both}
.big .n.pop{animation:numPop .5s cubic-bezier(.2,.8,.3,1)}
@keyframes numPop{0%{transform:scale(1)}30%{transform:scale(1.09)}100%{transform:scale(1)}}
.big .u{font-size:26px;font-weight:700;color:var(--teal-d);margin-inline-start:8px}
.big .m{font-size:16px;color:var(--soft)}
.cards{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease,background-color .35s ease,border-color .35s ease;animation:fadeUp .45s ease both}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cards .card:nth-child(1){animation-delay:0ms}.cards .card:nth-child(2){animation-delay:60ms}.cards .card:nth-child(3){animation-delay:120ms}.cards .card:nth-child(4){animation-delay:180ms}.cards .card:nth-child(5){animation-delay:240ms}.cards .card:nth-child(6){animation-delay:300ms}.cards .card:nth-child(7){animation-delay:360ms}.cards .card:nth-child(8){animation-delay:420ms}
.card .t{font-size:13px;font-weight:600;color:var(--mute)}
.card .n{font-size:38px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;margin:10px 0;overflow:hidden;background:var(--track)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.3,1);box-shadow:0 0 10px var(--tint)}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-sm)}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:center;transition:background-color .2s ease,color .2s ease}
th{background:linear-gradient(180deg,var(--card2),var(--card));font-size:13px;font-weight:600;color:var(--mute)}
tbody tr:hover{background:var(--hover)}
tr:last-child td{border-bottom:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tools .b{font-size:15px;padding:9px 16px;border-radius:999px}
.tools select{width:auto;font-size:15px;border-radius:999px;padding:9px 14px}
.ph{display:none;font-size:18px;margin-bottom:8px}
.gate{position:fixed;inset:0;background:rgba(16,17,18,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;animation:fadeUp .3s ease both}
.gate .card{width:100%;max-width:380px;animation:popIn .35s cubic-bezier(.2,.8,.3,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rw{display:flex;gap:8px}.rw .del{padding:8px 14px;font-size:18px}
.un{font-size:14px!important;padding:4px 12px!important;border-radius:999px!important;transition:transform .12s ease,background-color .2s ease,border-color .2s ease}
.un:hover{transform:scale(1.06);border-color:var(--red);color:var(--red)}
.hc{display:flex;gap:8px;align-items:flex-end;overflow-x:auto;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:150px;box-shadow:var(--shadow-sm)}
.hb{display:flex;flex-direction:column;align-items:center;min-width:56px;justify-content:flex-end;transition:transform .15s ease}
.hb:hover{transform:translateY(-4px)}
.hb i{display:block;width:30px;background:linear-gradient(180deg,var(--teal),var(--teal-d));border-radius:8px 8px 3px 3px;transition:height .5s cubic-bezier(.2,.8,.3,1),box-shadow .2s;box-shadow:0 0 12px var(--tint)}
.hb small{font-size:12px;color:var(--mute)}
.po,.sig{display:none}.sig{justify-content:space-between;margin-top:40px}
#tot{transition:background .6s}#tot.fl{background:var(--fl)}
.hide,.gate.hide{display:none}
.lkonly{display:none}body.lk .lkonly{display:block}body.lk .dt{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{*{transition:none!important;animation:none!important}.ph,.po{display:block}.sig{display:flex}.nop,#cards{display:none!important}header,.tools,#sv,#rn,#cd,#gate,.lkonly{display:none!important}body{background:#fff!important;background-image:none!important;font-size:14px}.big{background:#fff!important}.big .n{color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important}}
</style>
</head>
<body>
<header>
  <h1><img class="lg" src="logo.png" alt="">متابعة الكونكريت</h1>
  <span id="net">متصل</span>
  <button class="tab on" data-v="dv">اللوحة</button>
  <button class="tab" data-v="sv">المراقب</button>
  <button class="tab" id="lock" hidden>🔒 خروج</button>
  <button class="tab" id="themeToggle" aria-label="الوضع الليلي">🌙</button>
  <button class="tab" id="snd" aria-label="صوت التنبيه">🔔</button>
</header>
<main>
<section id="sv" class="hide">
  <div class="row" id="curS"></div>
  <h2>اسم المراقب</h2>
  <input id="who" placeholder="اكتب اسمك">
  <h2>المجهز</h2>
  <div class="grid sites" id="sites"></div>
  <h2>الكمية (م³)</h2>
  <div class="grid qtys" id="qtys"></div>
  <input id="custom" type="number" inputmode="decimal" step="0.5" min="0" placeholder="كمية مخصصة" style="margin-top:10px">
  <button id="send">اختر الكمية</button>
  <h2>آخر 5 عمليات</h2>
  <div class="tools" style="justify-content:flex-end"><button class="b un" id="clrB">🧹 تصفير آخر العمليات</button></div>
  <div id="recent"></div>
</section>

<section id="dv">
  <div class="tools dt">
    <select id="sess" style="width:auto;font-size:17px"></select>
    <select id="fs" style="width:auto;font-size:17px" aria-label="تصفية حسب المجهز"></select>
    <button class="b" id="rnB">🛠️ إدارة المجهزين</button>
    <button class="b" id="cdB">🔑 الرموز</button>
    <button class="b" id="newS">➕ صبة جديدة</button>
    <button class="b" id="delS" style="color:var(--bad)">🗑️ حذف الصبة</button>
    <button class="b" id="csv">⬇️ Excel</button>
    <button class="b" id="wa">📲 واتساب</button>
    <button class="b" id="pdf">🖨️ PDF / طباعة</button>
  </div>
  <div id="rn" class="card hide dt" style="margin-bottom:12px"><div id="rnf" class="grid"></div><div class="tools"><button class="b" id="rnA">➕ إضافة مجهز</button><button class="b" id="rnS">💾 حفظ</button><button class="b" id="rnC">إغلاق</button></div></div>
  <div id="cd" class="card hide dt" style="margin-bottom:12px"><label>رمز المراقبين الجديد<input id="cdo" type="password" autocomplete="off" placeholder="اتركه فارغاً بدون تغيير"></label><label>رمز المدير الجديد<input id="cdm" type="password" autocomplete="off" placeholder="اتركه فارغاً بدون تغيير"></label><div class="tools"><button class="b" id="cdS">💾 حفظ الرموز</button><button class="b" id="cdX">إلغاء رمز المراقبين</button></div></div>
  <div class="ph"><img class="plogo" src="logo.png" alt=""><div id="ph" style="text-align:center"></div></div>
  <div class="po" id="sum"></div>
  <div class="big"><div class="m" id="sname"></div><span class="n" id="tot">0</span><span class="u">م³</span><div class="m dt">إجمالي <span id="cnt">0</span> سيارة وصلت</div></div>
  <div class="grid cards" id="cards"></div>
  <button class="b lkonly" id="ul" style="width:100%;margin-top:14px">🔓 عرض التفاصيل (رمز المدير)</button>
  <h2 class="dt">السجل المباشر</h2>
  <div class="dt" style="overflow-x:auto"><table><thead><tr><th>الوقت</th><th>المجهز</th><th>الكمية</th><th>المراقب</th><th class="dt nop"></th></tr></thead><tbody id="log"></tbody></table></div>
<h2 class="dt nop">الكميات بالساعة</h2><div class="hc dt nop" id="hc"></div>
  <div class="sig"><span>توقيع المدير: ..........</span><span>توقيع المراقب: ..........</span><span>توقيع المجهز: ..........</span></div>
</section>
</main>

<div id="gate" class="gate hide"><div class="card"><h2 id="gt"></h2><input id="gp" type="password" autocomplete="off" placeholder="الرمز"><div class="tools"><button class="b" id="gok">دخول</button><button class="b" id="gx">إلغاء</button></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ===== الإعدادات: ضع بيانات مشروعك من Firebase هنا =====
const firebaseConfig = {
  apiKey: "AIzaSyCloEOgcNac0LgrZyktaId_IARNgeIoLhs",
  authDomain: "concrete-tracker-6c9fd.firebaseapp.com",
  projectId: "concrete-tracker-6c9fd",
  storageBucket: "concrete-tracker-6c9fd.firebasestorage.app",
  messagingSenderId: "749008210469",
  appId: "1:749008210469:web:3df56985c3d354ca3f4dcc",
  measurementId: "G-R5MSKPB3VF"
};
const COMPANY = "شركة نبع الهادي"
const SITES = ["مضخة 1", "مضخة 2", "مضخة 3"];   // عدّل الأسماء أو أضف مواقع
const QTYS = [7, 8, 9, 10];
// ======================================================

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const fmtT = t => new Date(t).toLocaleString('ar-IQ',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit'});
const num = n => (Math.round(n*100)/100).toLocaleString('en');

let fSite = 'all', names = {}, siteList = SITES.slice(), authH = {}, authOk = false, role = null, mgr = false, noSess = false, curList = [], seen = null, AC = null;
const nm = id => names[id] || id;   // الاسم المعروض للمضخة (المعرّف الأصلي يبقى ثابتاً في البيانات)
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let activeSid = ls.get('activeSid', null), viewSid = null, deliveries = {}, online = false, site = SITES[0], qty = null;
const device = ls.get('device', null) || (()=>{const d='D'+Math.random().toString(36).slice(2,6).toUpperCase();ls.set('device',d);return d})();

// ---- الوضع الليلي ----
const themeToggle = $('themeToggle');
const currentTheme = ls.get('theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function setDark(on) {
  if (on) document.documentElement.setAttribute('data-dark', '1');
  else document.documentElement.removeAttribute('data-dark');
}
setDark(currentTheme === 'dark');
themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
themeToggle.setAttribute('aria-label', currentTheme === 'dark' ? 'الوضع النهاري' : 'الوضع الليلي');
themeToggle.onclick = () => {
  const isDark = !document.documentElement.hasAttribute('data-dark');
  setDark(isDark);
  themeToggle.textContent = isDark ? '☀️' : '🌙';
  themeToggle.setAttribute('aria-label', isDark ? 'الوضع النهاري' : 'الوضع الليلي');
  ls.set('theme', isDark ? 'dark' : 'light');
};

// ---- تبويبات ----
function showTab(v) {
  document.querySelectorAll('.tab[data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  ['sv','dv'].forEach(i => $(i).classList.toggle('hide', i !== v));
}
document.querySelectorAll('.tab[data-v]').forEach(b => b.onclick = async () => { if (b.dataset.v === 'sv' && !(await needObs())) return; showTab(b.dataset.v); });
$('ul').onclick = async () => { if (await needMgr()) render(); };
$('lock').onclick = async () => { ls.set('cred', null); setRole(); showTab('dv'); };

// ---- الرموز ----
async function hash(c) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ct1|' + c));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function setRole() {
  const h = ls.get('cred', null);
  role = h && h === authH.m ? 'manager' : h && h === authH.o ? 'observer' : null;
  $('lock').hidden = !role;
  if (!role && authH.o && !$('sv').classList.contains('hide')) showTab('dv');
  render();
}
function gate(title, mode) {
  return new Promise(res => {
    $('gt').textContent = title; $('gp').value = ''; $('gate').classList.remove('hide'); $('gp').focus();
    const done = v => { $('gate').classList.add('hide'); res(v); };
    $('gok').onclick = () => { const v = $('gp').value.trim(); if (!v) return; if (mode === 'set' && v.length < 4) return alert('الرمز 4 خانات على الأقل'); done(v); };
    $('gx').onclick = () => done(null);
    $('gp').onkeydown = e => { if (e.key === 'Enter') $('gok').click(); };
  });
}
async function needObs() {
  if (!authOk) { alert('انتظر اتصال التطبيق ثم أعد المحاولة'); return false; }
  if (role || !authH.o) return true;
  const c = await gate('رمز الدخول', 'enter'); if (!c) return false;
  const h = await hash(c);
  if (h !== authH.o && h !== authH.m) { alert('الرمز غير صحيح'); return false; }
  ls.set('cred', h); setRole(); return true;
}
async function needMgr() {
  if (!authOk) { alert('انتظر اتصال التطبيق ثم أعد المحاولة'); return false; }
  if (role === 'manager') return true;
  if (!authH.m) {
    const c = await gate('أول استخدام: حدّد رمز المدير', 'set'); if (!c) return false;
    const h = await hash(c); await db.ref('meta/auth/m').set(h); ls.set('cred', h); authH.m = h; setRole(); return true;
  }
  const c = await gate('رمز المدير', 'enter'); if (!c) return false;
  const h = await hash(c);
  if (h !== authH.m) { alert('الرمز غير صحيح'); return false; }
  ls.set('cred', h); setRole(); return true;
}


// ---- الدخول والجلسة ----
firebase.auth().signInAnonymously().catch(e => alert('فشل تسجيل الدخول: ' + e.message));
db.ref('.info/connected').on('value', s => {
  online = !!s.val(); $('net').textContent = online ? 'متصل' : 'غير متصل'; $('net').classList.toggle('off', !online);
  if (online) flush();
});
db.ref('meta/activeSession').on('value', async s => {
  if (!s.val()) { await newSession('الصبة الأولى'); return; }
  activeSid = s.val(); ls.set('activeSid', activeSid);
  viewSid = {id: activeSid, auto: true};
  listen();
});
db.ref('sessions').on('value', s => {
  const v = s.val() || {};
  $('sess').innerHTML = Object.entries(v).sort((a,b)=>b[1].startedAt-a[1].startedAt)
    .map(([id,x]) => `<option value="${esc(id)}">${esc(x.name)}${id===activeSid?' ✔ (المفعّلة)':''}</option>`).join('');
  if (viewSid) $('sess').value = viewSid.id;
  window.sessions = v; render();
});
$('sess').onchange = async e => {
  if (e.target.value !== activeSid && !(await needMgr())) { e.target.value = activeSid; return; }
  const id = e.target.value, name = (window.sessions[id] || {}).name || '';
  if (id === activeSid) return;
  if (!confirm('تفعيل «' + name + '» لجميع الأجهزة؟ ستظهر عند الجميع، وستُسجَّل الإرسالات الجديدة عليها.')) { e.target.value = activeSid; return; }
  await db.ref('meta/activeSession').set(id);   // يصل لكل الأجهزة فوراً
};

db.ref('meta/names').on('value', s => { names = s.val() || {}; drawSites(); drawFilter(); lbl(); render(); });
db.ref('meta/auth').on('value', s => { authH = s.val() || {}; authOk = true; setRole(); });
db.ref('meta/siteList').on('value', s => { const v = s.val(); siteList = v ? Object.values(v) : SITES.slice(); if (!siteList.includes(site)) site = siteList[0]; drawSites(); drawFilter(); lbl(); render(); });
function notify() {
  if ($('dv').classList.contains('hide')) return;
  if (ls.get('snd', true)) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 880; g.gain.value = .3; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + .25); } catch (e) {} if (navigator.vibrate) navigator.vibrate(200); }
  $('tot').classList.add('fl'); setTimeout(() => $('tot').classList.remove('fl'), 1500);
}
$('snd').textContent = ls.get('snd', true) ? '🔔' : '🔕';
$('snd').onclick = () => { ls.set('snd', !ls.get('snd', true)); $('snd').textContent = ls.get('snd', true) ? '🔔' : '🔕'; };
let ref = null;
function listen() {
  if (ref) ref.off();
  ref = db.ref('deliveries/' + viewSid.id);
  seen = null;
  ref.on('value', s => { deliveries = s.val() || {}; const ks = Object.keys(deliveries);
    if (seen && ks.some(k => !seen.has(k))) notify(); seen = new Set(ks); render(); });
}
async function newSession(name) {
  const id = db.ref('sessions').push().key;
  await db.ref('sessions/' + id).set({name, startedAt: firebase.database.ServerValue.TIMESTAMP});
  await db.ref('meta/activeSession').set(id);
}
$('newS').onclick = async () => {
  if (!(await needMgr())) return;
  if (!confirm('بدء صبة جديدة؟ ستُؤرشف البيانات الحالية وتبدأ العدادات من الصفر.')) return;
  const n = prompt('اسم الصبة:', 'صبة ' + new Date().toLocaleDateString('ar-IQ'));
  if (n) { viewSid = null; await newSession(n); }
};

// ---- واجهة المراقب ----
$('who').value = ls.get('who', ''); $('who').oninput = e => ls.set('who', e.target.value);
function drawSites() {
  $('sites').innerHTML = siteList.map(id => `<button class="b${id===site?' sel':''}" data-s="${esc(id)}">${esc(nm(id))}</button>`).join('');
}
drawSites();
function drawFilter() {
  $('fs').innerHTML = '<option value="all">كل المجهزين</option>' + siteList.map(x => `<option value="${esc(x)}">${esc(nm(x))}</option>`).join('');
  $('fs').value = fSite;
}
$('qtys').innerHTML = QTYS.map(q => `<button class="b" data-q="${q}">+${q}</button>`).join('');
$('sites').onclick = e => { const b = e.target.closest('button'); if (!b) return; site = b.dataset.s; lbl();
  [...$('sites').children].forEach(x => x.classList.toggle('sel', x === b)); };
$('qtys').onclick = e => { const b = e.target.closest('button'); if (!b) return; qty = +b.dataset.q; $('custom').value = ''; lbl();
  [...$('qtys').children].forEach(x => x.classList.toggle('sel', x === b)); };
$('custom').oninput = e => { qty = parseFloat(e.target.value) || null; lbl(); [...$('qtys').children].forEach(x => x.classList.remove('sel')); };

function lbl(){ if(!$('send').disabled) $('send').textContent = qty ? `إرسال ${num(qty)} م³ — ${nm(site)}` : 'اختر الكمية'; }
// ---- الإرسال + الطابور المحلي ----
$('send').onclick = () => {
  if (!qty || qty <= 0 || qty > 100) return alert('اختر الكمية أولاً');
  const sid = activeSid || ls.get('activeSid', null);
  if (!sid) return alert('لم يتم تحميل الصبة الحالية بعد، تأكد من الاتصال لأول مرة');
  const id = db.ref().push().key;
  const item = {id, sid, site, qty, ts: Date.now(), device, sender: $('who').value.trim() || device};
  ls.set('q', [...ls.get('q', []), item]);
  ls.set('recent', [item, ...ls.get('recent', [])].slice(0, 5));
  qty = null; $('custom').value = ''; [...$('qtys').children].forEach(x => x.classList.remove('sel'));
  $('send').disabled = true; let t = 3; $('send').textContent = 'انتظر ' + t;
  const iv = setInterval(() => { t--; if (t <= 0) { clearInterval(iv); $('send').disabled = false; lbl(); } else $('send').textContent = 'انتظر ' + t; }, 1000);
  renderRecent(); flush();
};
let flushing = false;
async function flush() {
  if (flushing || !online) return; flushing = true;
  try {
    for (const it of ls.get('q', [])) {
      const {id, sid, ...d} = it;
      await db.ref(`deliveries/${sid}/${id}`).set({...d, serverTs: firebase.database.ServerValue.TIMESTAMP})
        .catch(e => { if (!/PERMISSION/i.test(String(e))) throw e; }); // مكرر = تم إرساله سابقاً
      ls.set('q', ls.get('q', []).filter(x => x.id !== id));
      renderRecent();
    }
  } catch (e) { console.warn('flush', e); }
  flushing = false;
}
setInterval(flush, 10000);
function renderRecent() {
  const pend = new Set(ls.get('q', []).map(x => x.id));
  $('recent').innerHTML = ls.get('recent', []).map(r =>
    `<div class="row"><span>${pend.has(r.id)?'⏳':'✅'} ${esc(nm(r.site))} — ${num(r.qty)} م³</span><span>${fmtT(r.ts)}${!pend.has(r.id) && Date.now() - r.ts < 120000 ? ` <button class="b un" data-u="${esc(r.id)}">↩️ تراجع</button>` : ''}</span></div>`).join('') || '<div class="row">لا توجد عمليات</div>';
}

$('recent').onclick = async e => {
  const b = e.target.closest('[data-u]'); if (!b) return;
  const it = ls.get('recent', []).find(x => x.id === b.dataset.u);
  if (!it || !confirm('التراجع عن هذه العملية؟')) return;
  const q = ls.get('q', []);
  if (q.some(x => x.id === it.id)) ls.set('q', q.filter(x => x.id !== it.id));
  else { try { await db.ref(`deliveries/${it.sid}/${it.id}`).remove(); } catch (err) { return alert('انتهت مهلة التراجع، اطلب من المدير الحذف'); } }
  ls.set('recent', ls.get('recent', []).filter(x => x.id !== it.id)); renderRecent();
};
// ---- تصفير آخر العمليات (البدء من الصفر) ----
$('clrB').onclick = async () => {
  if (!(await needMgr())) return;
  const hasRecent = ls.get('recent', []).length > 0, hasDel = Object.keys(deliveries).length > 0;
  if (!hasRecent && !hasDel) return alert('لا توجد عمليات لتصفيرها');
  if (!online) return alert('تحتاج اتصالاً بالإنترنت لتصفير العمليات المسجّلة');
  if (!viewSid) return alert('لم يتم تحميل الصبة الحالية بعد، تأكد من الاتصال');
  if (!confirm('تصفير آخر العمليات؟\n\nسيُحذف كل ما سُجِّل في الصبة الحالية وتعود العدادات إلى الصفر، وسيتم أرشفة العمليات المحذوفة.\nهذا الإجراء لا يمكن التراجع عنه.')) return;
  try {
    for (const [id, d] of Object.entries(deliveries)) await db.ref('audit').push({...d, id, sid: viewSid.id, deletedAt: Date.now()});   // أرشفة العمليات المحذوفة
    await db.ref('deliveries/' + viewSid.id).remove();   // حذف العمليات المسجّلة للعودة إلى الصفر
    ls.set('q', []);   // إفراغ الطابور المحلي للعمليات غير المرسلة
    ls.set('recent', []);   // مسح قائمة آخر 5 عمليات
    render(); renderRecent();
    alert('تم تصفير آخر العمليات — تم البدء من الصفر');
  } catch (e) { alert('تعذر التصفير: ' + e.message); }
};
setInterval(renderRecent, 15000);
// ---- لوحة المراقبة ----
function render() {
  const lk = !(authOk && (role === 'manager' || !authH.m)); document.body.classList.toggle('lk', lk);
  const f = lk ? 'all' : fSite;   // قبل إدخال الرمز: عرض مختصر فقط
  renderRecent();
  $('curS').textContent = 'الصبة الحالية: ' + ((window.sessions && window.sessions[activeSid] && window.sessions[activeSid].name) || '...');
  const all = Object.entries(deliveries).map(([id, d]) => ({...d, id})).sort((a,b) => b.ts - a.ts);
  const list = f === 'all' ? all : all.filter(d => d.site === f);
  const by = {}; siteList.forEach(s => by[s] = {q:0,c:0,t:0});
  all.forEach(d => { const x = by[d.site] || (by[d.site] = {q:0,c:0,t:0}); x.q += d.qty; x.c++; x.t = Math.max(x.t, d.ts); });
  const totEl = $('tot'); totEl.textContent = num(list.reduce((a,d) => a + d.qty, 0));
  totEl.classList.remove('pop'); void totEl.offsetWidth; totEl.classList.add('pop');
  $('cnt').textContent = list.length;
  const sn = (window.sessions && viewSid && window.sessions[viewSid.id]?.name) || '', fn = f === 'all' ? 'جميع المجهزين' : nm(f);
  $('sname').textContent = sn + (f === 'all' ? '' : ' — ' + fn);
  $('ph').textContent = COMPANY + ' — تقرير: ' + sn + ' | ' + fn + ' | ' + new Date().toLocaleString('ar-IQ');
  const sum = all.reduce((a,d) => a + d.qty, 0) || 1;
  $('cards').innerHTML = Object.entries(by).filter(([s]) => f === 'all' || s === f).map(([s,x]) =>
    `<div class="card"><div class="t">${esc(nm(s))}</div><div class="n">${num(x.q)} م³</div><div class="bar"><i style="width:${Math.round(x.q/sum*100)}%"></i></div><div class="dt">${x.c} سيارة</div><div class="dt">آخر وصول: ${x.t ? fmtT(x.t) : '—'}</div></div>`).join('');
  curList = list;
  $('sum').innerHTML = '<table><tr><th>المجهز</th><th>السيارات</th><th>الكمية م³</th></tr>' + Object.keys(by).filter(s => f === 'all' || s === f).map(s => `<tr><td>${esc(nm(s))}</td><td>${list.filter(d => d.site === s).length}</td><td>${num(list.filter(d => d.site === s).reduce((a, d) => a + d.qty, 0))}</td></tr>`).join('') + '</table>';
  const hr = {}; [...list].reverse().forEach(d => { const k = new Date(d.ts).toLocaleString('en-GB', {day: '2-digit', month: '2-digit', hour: '2-digit', hour12: false}); hr[k] = (hr[k] || 0) + d.qty; });
  const mx = Math.max(...Object.values(hr), 1);
  $('hc').innerHTML = Object.entries(hr).map(([k, v]) => `<div class="hb"><b>${num(v)}</b><i style="height:${Math.max(4, v / mx * 100)}px"></i><small>${k}</small></div>`).join('') || 'لا توجد بيانات';
  $('log').innerHTML = list.map(d => `<tr><td>${fmtT(d.ts)}</td><td>${esc(nm(d.site))}</td><td>${num(d.qty)}</td><td>${esc(d.sender)}</td><td class="dt nop"><button class="b un" data-x="${esc(d.id)}">🗑️</button></td></tr>`).join('');
}

// ---- التصدير ----
const cell = v => typeof v === 'number' ? `<Cell><Data ss:Type="Number">${v}</Data></Cell>` : `<Cell><Data ss:Type="String">${esc(v)}</Data></Cell>`;
const sheet = (n, rows) => `<Worksheet ss:Name="${n}"><Table>${rows.map(r => `<Row>${r.map(cell).join('')}</Row>`).join('')}</Table></Worksheet>`;
function xlsOf(list) {
  const L = [...list].sort((a, b) => a.ts - b.ts), g = {};
  L.forEach(d => { const k = nm(d.site); g[k] = g[k] || [0, 0]; g[k][0]++; g[k][1] += d.qty; });
  const log = [['الوقت', 'المجهز', 'الكمية م3', 'المراقب', 'الجهاز']].concat(L.map(d => [new Date(d.ts).toLocaleString('en-GB'), nm(d.site), d.qty, d.sender, d.device]));
  const sm = [['المجهز', 'السيارات', 'الكمية م3']].concat(Object.entries(g).map(([k, v]) => [k, v[0], Math.round(v[1] * 100) / 100]), [['الإجمالي', L.length, Math.round(L.reduce((a, d) => a + d.qty, 0) * 100) / 100]]);
  return '<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' + sheet('السجل', log) + sheet('الملخص', sm) + '</Workbook>';
}
function dl(n, t) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], {type: 'application/vnd.ms-excel;charset=utf-8'})); a.download = n; a.click(); }
$('csv').onclick = () => dl('concrete-' + (fSite === 'all' ? 'all' : nm(fSite)) + '.xls', xlsOf(curList));
$('wa').onclick = () => {
  const L = Object.values(deliveries), g = {}; L.forEach(d => g[nm(d.site)] = (g[nm(d.site)] || 0) + d.qty);
  const t = [COMPANY, 'الصبة: ' + ($('sname').textContent.split(' — ')[0]), new Date().toLocaleString('ar-IQ'), 'الإجمالي: ' + num(L.reduce((a, d) => a + d.qty, 0)) + ' م³ (' + L.length + ' سيارة)', ''].concat(Object.entries(g).map(([k, v]) => '• ' + k + ': ' + num(v) + ' م³')).join('\n');
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
};
$('log').onclick = async e => {
  const b = e.target.closest('[data-x]'); if (!b || !(await needMgr())) return;
  const id = b.dataset.x, d = deliveries[id]; if (!d || !confirm(`حذف عملية ${num(d.qty)} م³ (${nm(d.site)})؟`)) return;
  try { await db.ref('audit').push({...d, id, sid: viewSid.id, deletedAt: Date.now()}); await db.ref(`deliveries/${viewSid.id}/${id}`).remove(); }
  catch (err) { alert('تعذر الحذف: ' + err.message); }
};
let draft = [];
function drawRn() {
  $('rnf').innerHTML = draft.map((d, i) => `<div class="rw"><input data-i="${i}" maxlength="30" value="${esc(d.name)}"><button class="b del" data-d="${i}" aria-label="حذف">🗑️</button></div>`).join('');
}
$('rnB').onclick = async () => { if (!(await needMgr())) return; draft = siteList.map(id => ({id, name: nm(id)})); drawRn(); $('rn').classList.toggle('hide'); };
$('rnf').oninput = e => { const i = e.target.dataset.i; if (i !== undefined) draft[i].name = e.target.value; };
$('rnf').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return;
  if (draft.length <= 1) return alert('يجب أن يبقى مجهز واحد على الأقل');
  if (confirm('حذف هذا المجهز؟ تبقى عملياتها القديمة في السجل.')) { draft.splice(+b.dataset.d, 1); drawRn(); } };
$('rnA').onclick = () => { draft.push({id: 'p' + Date.now().toString(36), name: 'مجهز جديد'}); drawRn(); };
$('rnC').onclick = () => $('rn').classList.add('hide');
$('rnS').onclick = async () => {
  if (!online) return alert('تحتاج اتصالاً بالإنترنت للحفظ');
  const out = {}, seen = new Set();
  Object.keys(names).forEach(k => { if (!draft.some(d => d.id === k)) out[k] = names[k]; });   // أسماء المضخات المحذوفة تبقى للسجل
  for (const d of draft) {
    const v = d.name.trim();
    if (!v) return alert('لا يجوز ترك اسم فارغ');
    if (seen.has(v)) return alert('الأسماء يجب ألا تتكرر');
    seen.add(v); if (v !== d.id) out[d.id] = v;
  }
  try { await db.ref('meta').update({siteList: draft.map(d => d.id), names: Object.keys(out).length ? out : null}); $('rn').classList.add('hide'); }
  catch (e) { alert('تعذر الحفظ: ' + e.message); }
};
$('delS').onclick = async () => {
  if (!(await needMgr())) return;
  if (!online) return alert('تحتاج اتصالاً بالإنترنت');
  if (!viewSid) return;
  const sid = viewSid.id, name = ((window.sessions || {})[sid] || {}).name || '';
  const a = 10 + Math.floor(Math.random() * 40), b = 10 + Math.floor(Math.random() * 40);
  const ans = prompt(`⚠️ سيُحذف «${name}» بكل عملياته نهائياً ولا يمكن التراجع.\nللتأكيد أجب: ${a} + ${b} = ؟`);
  if (ans === null) return;
  const n = parseInt(String(ans).trim().replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)), 10);
  if (n !== a + b) return alert('الإجابة غير صحيحة، لم يُحذف شيء');
  dl('backup-' + name + '.xls', xlsOf(Object.values(deliveries)));   // نسخة احتياطية قبل الحذف
  try {
    const others = Object.entries(window.sessions || {}).filter(([id]) => id !== sid).sort((x, y) => y[1].startedAt - x[1].startedAt);
    if (others.length) await db.ref('meta/activeSession').set(others[0][0]); else await newSession('الصبة الأولى');
    await db.ref('deliveries/' + sid).remove();
    await db.ref('sessions/' + sid).remove();
    alert('تم حذف الصبة');
  } catch (e) { alert('تعذر الحذف: ' + e.message + '\nتأكد من نشر قواعد Firebase الجديدة'); }
};
$('cdB').onclick = async () => { if (!(await needMgr())) return; $('cd').classList.toggle('hide'); };
$('cdS').onclick = async () => {
  const o = $('cdo').value.trim(), m = $('cdm').value.trim();
  if (!o && !m) return;
  if ((o && o.length < 4) || (m && m.length < 4)) return alert('الرمز 4 خانات على الأقل');
  const u = {}; if (o) u.o = await hash(o); if (m) { u.m = await hash(m); ls.set('cred', u.m); }
  try { await db.ref('meta/auth').update(u); $('cdo').value = $('cdm').value = ''; $('cd').classList.add('hide'); alert('تم حفظ الرموز'); }
  catch (e) { alert('تعذر الحفظ: ' + e.message); }
};
$('cdX').onclick = async () => { if (confirm('إلغاء رمز المراقبين؟ سيدخل أي شخص تبويب المراقب بدون رمز.')) await db.ref('meta/auth/o').remove(); };
$('pdf').onclick = () => window.print();
drawFilter();
$('fs').onchange = e => { fSite = e.target.value; render(); };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
lbl(); renderRecent();
</script>
