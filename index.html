<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff6a00">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<title>متابعة الكونكريت</title>
<style>
:root{--slab:#cdd0d2;--paper:#fff;--ink:#000;--mix:#ff6a00;--ok:#00632b;--bad:#b3001b;--edge:3px solid #000}
*{box-sizing:border-box}
body{margin:0;background:var(--slab);color:var(--ink);font:700 18px/1.5 "Cairo",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
header{background:var(--mix);color:#000;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;border-bottom:var(--edge)}
header h1{font-size:22px;font-weight:900;margin:0;flex:1}
.tab{background:var(--paper);color:#000;border:var(--edge);border-radius:8px;padding:6px 16px;font:inherit;cursor:pointer}
.tab.on{background:#000;color:#fff}
#net{font-size:14px;padding:2px 12px;border:var(--edge);border-radius:20px;background:var(--paper);color:var(--ok)}
#net.off{background:var(--bad);color:#fff}
main{padding:14px 14px 40px;max-width:1100px;margin:auto}
:focus-visible{outline:4px solid #000;outline-offset:3px}
.grid{display:grid;gap:10px}
.sites{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.qtys{grid-template-columns:repeat(4,1fr)}
button.b{font:inherit;font-size:22px;font-weight:900;padding:16px 6px;border:var(--edge);border-radius:8px;background:var(--paper);color:#000;cursor:pointer;box-shadow:0 5px 0 #000;transition:transform .08s,box-shadow .08s}
button.b:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
button.b.sel{background:var(--mix)}
input,select{font:inherit;font-size:22px;padding:12px;border:var(--edge);border-radius:8px;width:100%;background:var(--paper);color:#000}
h2{margin:22px 0 8px;font-size:19px;font-weight:900;padding-right:10px;border-right:8px solid var(--mix)}
#send{display:block;width:100%;font:inherit;font-size:26px;font-weight:900;padding:20px 12px;background:#000;color:#fff;border:0;border-radius:10px;margin:16px 0;cursor:pointer;position:sticky;bottom:10px;box-shadow:0 0 0 5px var(--slab)}
#send:disabled{background:#666}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--paper);border:var(--edge);border-radius:8px;margin-bottom:6px}
.big{background:var(--paper);border:var(--edge);border-bottom:14px solid var(--mix);border-radius:8px;padding:14px 18px;margin-bottom:14px}
.big .n{font-size:clamp(64px,16vw,120px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
.big .u{font-size:30px;font-weight:900;margin-inline-start:8px}
.big .m{font-size:20px}
.cards{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--paper);border:var(--edge);border-radius:8px;padding:12px}
.card .t{font-size:20px;font-weight:900}
.card .n{font-size:40px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}
.bar{height:12px;border:2px solid #000;border-radius:6px;margin:8px 0;overflow:hidden;background:var(--slab)}
.bar i{display:block;height:100%;background:var(--mix);transition:width .5s}
table{width:100%;border-collapse:collapse;background:var(--paper)}
th,td{border:2px solid #000;padding:8px;text-align:center}th{background:var(--mix)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tools .b{font-size:17px;padding:10px 14px}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header,.tools,#sv{display:none}body{background:#fff;font-size:14px}}
</style>
</head>
<body>
<header>
  <h1>متابعة الكونكريت</h1>
  <span id="net">متصل</span>
  <button class="tab on" data-v="sv">المراقب</button>
  <button class="tab" data-v="dv">اللوحة</button>
</header>
<main>
<section id="sv">
  <h2>اسم المراقب / رقم الجهاز</h2>
  <input id="who" placeholder="مثال: أحمد - مضخة 1">
  <h2>الموقع / المضخة</h2>
  <div class="grid sites" id="sites"></div>
  <h2>الكمية (م³)</h2>
  <div class="grid qtys" id="qtys"></div>
  <input id="custom" type="number" inputmode="decimal" step="0.5" min="0" placeholder="كمية مخصصة" style="margin-top:10px">
  <button id="send">اختر الكمية</button>
  <h2>آخر 5 عمليات</h2>
  <div id="recent"></div>
</section>

<section id="dv" class="hide">
  <div class="tools">
    <select id="sess" style="width:auto;font-size:17px"></select>
    <button class="b" id="newS">➕ صبة جديدة</button>
    <button class="b" id="csv">⬇️ Excel (CSV)</button>
    <button class="b" id="pdf">🖨️ PDF / طباعة</button>
  </div>
  <div class="big"><div class="m" id="sname"></div><span class="n" id="tot">0</span><span class="u">م³</span><div class="m">إجمالي <span id="cnt">0</span> سيارة وصلت</div></div>
  <div class="grid cards" id="cards"></div>
  <h2>السجل المباشر</h2>
  <div style="overflow-x:auto"><table><thead><tr><th>الوقت</th><th>الموقع</th><th>الكمية</th><th>المراقب</th></tr></thead><tbody id="log"></tbody></table></div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ===== الإعدادات: ضع بيانات مشروعك من Firebase هنا =====
const firebaseConfig = {
  apiKey: "AIzaSyCloEOgcNac0LgrZyktaId_IARNgeIoLhs",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};
const SITES = ["مضخة 1", "مضخة 2", "مضخة 3"];   // عدّل الأسماء أو أضف مواقع
const QTYS = [8, 9, 10, 12];
// ======================================================

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const fmtT = t => new Date(t).toLocaleString('ar-IQ',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit'});
const num = n => (Math.round(n*100)/100).toLocaleString('en');

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let activeSid = ls.get('activeSid', null), viewSid = null, deliveries = {}, online = false, site = SITES[0], qty = null;
const device = ls.get('device', null) || (()=>{const d='D'+Math.random().toString(36).slice(2,6).toUpperCase();ls.set('device',d);return d})();

// ---- تبويبات ----
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  ['sv','dv'].forEach(v => $(v).classList.toggle('hide', v !== b.dataset.v));
});

// ---- الدخول والجلسة ----
firebase.auth().signInAnonymously().catch(e => alert('فشل تسجيل الدخول: ' + e.message));
db.ref('.info/connected').on('value', s => {
  online = !!s.val(); $('net').textContent = online ? 'متصل' : 'غير متصل'; $('net').classList.toggle('off', !online);
  if (online) flush();
});
db.ref('meta/activeSession').on('value', async s => {
  if (!s.val()) { await newSession('الصبة الأولى'); return; }
  activeSid = s.val(); ls.set('activeSid', activeSid);
  if (!viewSid || viewSid.auto) viewSid = {id: activeSid, auto: true};
  listen();
});
db.ref('sessions').on('value', s => {
  const v = s.val() || {};
  $('sess').innerHTML = Object.entries(v).sort((a,b)=>b[1].startedAt-a[1].startedAt)
    .map(([id,x]) => `<option value="${esc(id)}">${esc(x.name)}${id===activeSid?' (الحالية)':''}</option>`).join('');
  if (viewSid) $('sess').value = viewSid.id;
  window.sessions = v; render();
});
$('sess').onchange = e => { viewSid = {id: e.target.value, auto: e.target.value === activeSid}; listen(); };

let ref = null;
function listen() {
  if (ref) ref.off();
  ref = db.ref('deliveries/' + viewSid.id);
  ref.on('value', s => { deliveries = s.val() || {}; render(); });
}
async function newSession(name) {
  const id = db.ref('sessions').push().key;
  await db.ref('sessions/' + id).set({name, startedAt: firebase.database.ServerValue.TIMESTAMP});
  await db.ref('meta/activeSession').set(id);
}
$('newS').onclick = async () => {
  if (!confirm('بدء صبة جديدة؟ ستُؤرشف البيانات الحالية وتبدأ العدادات من الصفر.')) return;
  const n = prompt('اسم الصبة:', 'صبة ' + new Date().toLocaleDateString('ar-IQ'));
  if (n) { viewSid = null; await newSession(n); }
};

// ---- واجهة المراقب ----
$('who').value = ls.get('who', ''); $('who').oninput = e => ls.set('who', e.target.value);
$('sites').innerHTML = SITES.map((s,i) => `<button class="b${i?'':' sel'}" data-s="${esc(s)}">${esc(s)}</button>`).join('');
$('qtys').innerHTML = QTYS.map(q => `<button class="b" data-q="${q}">+${q}</button>`).join('');
$('sites').onclick = e => { const b = e.target.closest('button'); if (!b) return; site = b.dataset.s; lbl();
  [...$('sites').children].forEach(x => x.classList.toggle('sel', x === b)); };
$('qtys').onclick = e => { const b = e.target.closest('button'); if (!b) return; qty = +b.dataset.q; $('custom').value = ''; lbl();
  [...$('qtys').children].forEach(x => x.classList.toggle('sel', x === b)); };
$('custom').oninput = e => { qty = parseFloat(e.target.value) || null; lbl(); [...$('qtys').children].forEach(x => x.classList.remove('sel')); };

function lbl(){ if(!$('send').disabled) $('send').textContent = qty ? `إرسال ${num(qty)} م³ — ${site}` : 'اختر الكمية'; }
// ---- الإرسال + الطابور المحلي ----
$('send').onclick = () => {
  if (!qty || qty <= 0 || qty > 100) return alert('اختر الكمية أولاً');
  const sid = activeSid || ls.get('activeSid', null);
  if (!sid) return alert('لم يتم تحميل الصبة الحالية بعد، تأكد من الاتصال لأول مرة');
  const id = db.ref().push().key;
  const item = {id, sid, site, qty, ts: Date.now(), device, sender: $('who').value.trim() || device};
  ls.set('q', [...ls.get('q', []), item]);
  ls.set('recent', [item, ...ls.get('recent', [])].slice(0, 5));
  qty = null; $('custom').value = ''; [...$('qtys').children].forEach(x => x.classList.remove('sel'));
  $('send').disabled = true; let t = 3; $('send').textContent = 'انتظر ' + t;
  const iv = setInterval(() => { t--; if (t <= 0) { clearInterval(iv); $('send').disabled = false; lbl(); } else $('send').textContent = 'انتظر ' + t; }, 1000);
  renderRecent(); flush();
};
let flushing = false;
async function flush() {
  if (flushing || !online) return; flushing = true;
  try {
    for (const it of ls.get('q', [])) {
      const {id, sid, ...d} = it;
      await db.ref(`deliveries/${sid}/${id}`).set({...d, serverTs: firebase.database.ServerValue.TIMESTAMP})
        .catch(e => { if (!/PERMISSION/i.test(String(e))) throw e; }); // مكرر = تم إرساله سابقاً
      ls.set('q', ls.get('q', []).filter(x => x.id !== id));
      renderRecent();
    }
  } catch (e) { console.warn('flush', e); }
  flushing = false;
}
setInterval(flush, 10000);
function renderRecent() {
  const pend = new Set(ls.get('q', []).map(x => x.id));
  $('recent').innerHTML = ls.get('recent', []).map(r =>
    `<div class="row"><span>${pend.has(r.id)?'⏳':'✅'} ${esc(r.site)} — ${num(r.qty)} م³</span><span>${fmtT(r.ts)}</span></div>`).join('') || '<div class="row">لا توجد عمليات</div>';
}

// ---- لوحة المراقبة ----
function render() {
  renderRecent();
  const list = Object.values(deliveries).sort((a,b) => b.ts - a.ts);
  const by = {}; SITES.forEach(s => by[s] = {q:0,c:0,t:0});
  list.forEach(d => { const x = by[d.site] || (by[d.site] = {q:0,c:0,t:0}); x.q += d.qty; x.c++; x.t = Math.max(x.t, d.ts); });
  $('tot').textContent = num(list.reduce((a,d) => a + d.qty, 0)); $('cnt').textContent = list.length;
  $('sname').textContent = (window.sessions && viewSid && window.sessions[viewSid.id]?.name) || '';
  const sum = list.reduce((a,d) => a + d.qty, 0) || 1;
  $('cards').innerHTML = Object.entries(by).map(([s,x]) =>
    `<div class="card"><div class="t">${esc(s)}</div><div class="n">${num(x.q)} م³</div><div class="bar"><i style="width:${Math.round(x.q/sum*100)}%"></i></div><div>${x.c} سيارة</div><div>آخر وصول: ${x.t ? fmtT(x.t) : '—'}</div></div>`).join('');
  $('log').innerHTML = list.map(d => `<tr><td>${fmtT(d.ts)}</td><td>${esc(d.site)}</td><td>${num(d.qty)}</td><td>${esc(d.sender)}</td></tr>`).join('');
}

// ---- التصدير ----
$('csv').onclick = () => {
  const rows = [['الوقت','الموقع','الكمية م3','المراقب','الجهاز']].concat(
    Object.values(deliveries).sort((a,b) => a.ts - b.ts).map(d => [new Date(d.ts).toLocaleString('en-GB'), d.site, d.qty, d.sender, d.device]));
  const csv = '\ufeff' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'concrete-report.csv'; a.click();
};
$('pdf').onclick = () => window.print();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
lbl(); renderRecent();
</script>
</body>
</html>
